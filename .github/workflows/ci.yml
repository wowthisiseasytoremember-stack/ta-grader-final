name: CI

on:
  push:
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile source
        run: python -m py_compile TA_Grader.py
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
